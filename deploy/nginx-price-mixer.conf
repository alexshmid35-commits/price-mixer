log_format price_mixer_safe
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent request_id=$sent_http_x_request_id';
access_log /var/log/nginx/price-mixer.access.log price_mixer_safe;

server {
    listen 80;
    listen [::]:80;
    server_name price-mixer.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name price-mixer.example.com;

    ssl_certificate /etc/letsencrypt/live/price-mixer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/price-mixer.example.com/privkey.pem;

    client_max_body_size 200m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
